[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apainting-codex-mvp"
version = "0.2.0"
description = "Codex-assisted drawing program compiler for botanical line-art images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "scikit-image>=0.22",
  "pydantic>=2.7",
  "openai>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
apainting = "apainting.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apainting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
